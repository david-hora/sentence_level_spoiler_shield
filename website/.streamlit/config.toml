[theme]
base = "light"
primaryColor = "#ad402e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fffaf5"
textColor = "#392824"
borderColor = "#daccc5"
redColor = "#c93730"
greenColor = "#397150"
blueColor = "#355b78"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
paddingTop = "0.75rem"
paddingBottom = "3rem"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
